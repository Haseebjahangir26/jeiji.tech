<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | jeiji.tech</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#080808" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080808;
      --surface: #111110;
      --fg: #F4F0EA;
      --muted: #9A958D;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #D96B43;
      --accent-bright: #FF8A5B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 480px; }
    .code {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 8rem;
      font-weight: 400;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--fg);
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .terminal {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      text-align: left;
      margin-bottom: 2rem;
    }
    .terminal span { color: var(--accent); }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #080808;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }
    a:hover {
      background: var(--accent-bright);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(217, 107, 67, 0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="terminal">
      <span>$</span> curl https://jeiji.tech<br />
      <span>→</span> 200 OK ✓
    </div>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
